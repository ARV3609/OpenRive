# Builds a ready-to-run Windows x64 zip on every push, so there is always a
# downloadable OpenRive.exe without making a release by hand.
#
#   push to any branch   builds, publishes the zip to the rolling "desktop-latest"
#                        pre-release, and keeps it as a workflow artifact
#   Actions -> Desktop zip -> Run workflow   same thing on demand
#
# This is deliberately separate from desktop.yml: that one is the official
# multi-platform release (tags, DMGs, signing, the updater manifests). This one
# only answers "give me the newest Windows build", and never touches `latest`,
# because a pre-release is excluded from GitHub's latest-release redirect that
# the in-app updater reads.
name: Desktop zip

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# one build per branch: a newer push cancels the older build of the same branch
concurrency:
  group: desktop-zip-${{ github.ref }}
  cancel-in-progress: true

env:
  # the release every build is published to; the assets are replaced each time
  ROLLING_TAG: desktop-latest

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # A build from a branch has no version tag, so stamp something unique and
      # obviously not a release. Releases keep stamping their own tag in desktop.yml.
      - name: Stamp the version
        shell: bash
        run: bun scripts/set-desktop-version.ts "0.0.0-build.${{ github.run_number }}"

      # apps/desktop/build/server: the Next.js standalone bundle the app copies in
      - name: Build the web server bundle
        run: bun run --cwd apps/desktop build:server

      # Electrobun does not cross-compile; this produces the Windows bundle,
      # its updater manifest and the setup zip under apps/desktop/artifacts
      - name: Build the desktop app
        working-directory: apps/desktop
        run: bunx electrobun build --env=stable

      # Electrobun's own zip keeps its internal name. This copies it to a stable,
      # predictable name and falls back to zipping the artifacts if the name ever
      # changes, so the workflow does not quietly publish nothing.
      #
      # Note the ${version} braces: inside a double-quoted PowerShell string
      # "$version.zip" reads the property "zip" of $version, not a file name.
      - name: Package the zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.0.0-build.${{ github.run_number }}'
          $artifacts = 'apps/desktop/artifacts'
          $named = 'dist/OpenRive-win-x64-' + $version + '.zip'
          $latest = 'dist/OpenRive-win-x64-latest.zip'

          if (-not (Test-Path $artifacts)) { throw "no $artifacts: the build produced nothing" }
          New-Item -ItemType Directory -Force dist | Out-Null

          # Say what the build produced before packaging it, so a failure here is
          # readable in the job log without downloading anything.
          Write-Host '--- apps/desktop/artifacts'
          $files = @(Get-ChildItem $artifacts -Recurse -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { Write-Host '  (empty)' }
          foreach ($f in $files) { Write-Host ('  ' + $f.FullName + '  ' + [math]::Round($f.Length / 1MB, 1) + ' MB') }

          $built = $files | Where-Object { $_.Extension -eq '.zip' } | Sort-Object Length -Descending | Select-Object -First 1
          if ($built) {
            Write-Host ('using ' + $built.Name + ' (' + [math]::Round($built.Length / 1MB, 1) + ' MB)')
            Copy-Item -LiteralPath $built.FullName -Destination $named -ErrorAction Continue
          } else {
            Write-Host 'no zip in the artifacts; archiving the whole folder here'
            Compress-Archive -Path (Join-Path $artifacts '*') -DestinationPath $named -ErrorAction Continue
          }

          if (-not (Test-Path $named)) {
            # nothing to package under apps/desktop: pack the app that was built,
            # wherever the toolchain put it, so the run still yields a zip
            Write-Host '--- looking for a built app elsewhere in the tree'
            $exe = Get-ChildItem . -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notlike '*node_modules*' -and $_.FullName -notlike '*.hutch*' } |
              Select-Object -First 1
            Get-ChildItem . -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notlike '*node_modules*' -and $_.FullName -notlike '*.hutch*' } |
              ForEach-Object { Write-Host ('  exe: ' + $_.FullName) }
            if (-not $exe) { throw 'the build produced no .zip and no .exe anywhere in the tree' }
            $root = Split-Path $exe.FullName -Parent
            Compress-Archive -Path (Join-Path $root '*') -DestinationPath $named
          }
          Copy-Item -LiteralPath $named -Destination $latest

          # the updater reads these next to the bundle; shipped when present
          $files | Where-Object { $_.Extension -in '.json', '.zst', '.patch' } | Copy-Item -Destination dist -ErrorAction SilentlyContinue
          Get-ChildItem dist -File | ForEach-Object { Write-Host ('dist: ' + $_.Name + '  ' + [math]::Round($_.Length / 1MB, 1) + ' MB') }

      - name: Build diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($dir in @('apps/desktop/artifacts', 'apps/desktop/build', 'build')) {
            Write-Host ('--- ' + $dir)
            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host ('  ' + $_.FullName + '  ' + [math]::Round($_.Length / 1MB, 1) + ' MB') }
            } else { Write-Host '  (missing)' }
          }

      - name: Check the zip holds the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist -Filter '*-latest.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no *-latest.zip was produced' }
          $out = Join-Path $env:RUNNER_TEMP 'zipcheck'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $out -Force
          $exe = Get-ChildItem $out -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            $seen = (Get-ChildItem $out -Recurse -File | Select-Object -First 20 | ForEach-Object { $_.Name }) -join ', '
            throw "the zip contains no .exe, only: $seen"
          }
          Write-Host ('zip contains ' + $exe.Name + ' (' + [math]::Round($exe.Length / 1MB, 1) + ' MB)')

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrive-win-x64-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # The rolling pre-release. Same URL every time, so a link in a chat or a
      # README keeps working: /releases/download/desktop-latest/OpenRive-win-x64-latest.zip
      - name: Publish to the rolling pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:ROLLING_TAG

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --prerelease --title 'Desktop builds (newest first)' --notes @'
          Windows x64 builds of OpenRive, replaced on every push.

          Download **OpenRive-win-x64-latest.zip**, unzip it and run `OpenRive.exe`. The versioned zip beside it is
          the exact build. These are unsigned development builds: Windows shows **SmartScreen -> More info -> Run
          anyway** on first launch, and the app keeps its data in your user data folder.

          For a signed, tagged release with installers for every platform, use the **Desktop** workflow instead.
          '@
          }

          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release upload $tag @files --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'uploading the zip failed' }

      - name: Summarise
        shell: pwsh
        run: |
          $version = '0.0.0-build.${{ github.run_number }}'
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:ROLLING_TAG"
          @"
          ### Windows x64 zip $version

          - Direct download: [$url/OpenRive-win-x64-latest.zip]($url/OpenRive-win-x64-latest.zip)
          - Exact build: \`OpenRive-win-x64-${version}.zip\`
          - Workflow artifact: openrive-win-x64-${{ github.run_number }} (14 days)
          - Branch: \`$env:GITHUB_REF_NAME\` at $env:GITHUB_SHA
          "@ >> $env:GITHUB_STEP_SUMMARY
